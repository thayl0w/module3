<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Recipe Finder — World Cuisines</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-top">
      <a href="index.html" class="icon-btn" title="Home">🏠 Home</a>
      <h1 class="logo">Recipe Finder</h1>
      <div class="header-actions">
        <button id="backBtn" class="icon-btn" title="Back" aria-hidden="true">🔙 Back</button>
        <a href="categories.html" class="icon-btn" title="Categories">📚 Categories</a>
        <a href="about.html" class="icon-btn" title="About">ℹ️ About</a>
        <button id="favoritesToggle" class="icon-btn" aria-pressed="false" title="Show Favorites">★ Favorites</button>
        <button id="themeToggle" class="icon-btn" title="Toggle Theme">🌙</button>
      </div>
    </div>
    <p class="tagline">Discover dishes from around the world — search, view, and save favorites.</p>
  </header>

  <main>
    <section class="search-area">
      <div class="search-row">
        <input id="searchInput" type="search" placeholder="Search recipes e.g., chicken, pasta, adobo" aria-label="Search recipes" />
        <div class="search-controls">
          <button id="micBtn" class="action-btn" title="Voice search">🎤</button>
          <button id="searchBtn" class="primary-btn">Search</button>
        </div>
      </div>

      <div class="filters-row">
        <select id="categorySelect" aria-label="Filter by category">
          <option value="">All categories</option>
        </select>

        <select id="countrySelect" aria-label="Filter by country / area">
          <option value="">All countries</option>
        </select>

        <button id="viewFavsBtn" class="secondary-btn" title="View my favorites">My Favorites</button>
      </div>
    </section>

    <section id="content" class="content">
      <div id="spinner" class="spinner hidden" aria-hidden="true" role="status" aria-live="polite"></div>
      <div id="recipes" class="recipes-grid" role="list" aria-live="polite"></div>
      <div id="emptyState" class="empty-state hidden">No recipes to show. Try searching or choose a country.</div>
    </section>
  </main>

  <div id="recipeModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-panel">
      <div class="modal-top">
        <button id="modalBackBtn" class="icon-btn" title="Back to list">🔙 Back</button>
        <button id="closeModal" class="modal-close" aria-label="Close recipe">✖</button>
      </div>
      <div id="modalBody" class="modal-body">
        <img id="modalImage" class="modal-image" alt="" />
        <div class="modal-info">
          <h2 id="modalTitle"></h2>
          <p id="modalMeta" class="meta"></p>

          <h3>Ingredients</h3>
          <ul id="ingredientsList" class="ingredients"></ul>

          <h3>Instructions</h3>
          <p id="modalInstructions" class="instructions"></p>

          <p class="modal-links">
            <a id="sourceLink" href="#" target="_blank" rel="noopener">Open source recipe</a>
            <button id="favToggle" class="primary-btn">Add to Favorites</button>
          </p>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-content">
      <div class="footer-icons">
        <!-- Instagram -->
        <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Instagram">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584..."/></svg>
        </a>

        <!-- Facebook -->
        <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Facebook">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627..."/></svg>
        </a>

        <!-- Twitter -->
        <a href="https://www.twitter.com" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Twitter">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M23.953 4.57a10 10..."/></svg>
        </a>

        <!-- YouTube -->
        <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="YouTube">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3..."/></svg>
        </a>

        <!-- Pinterest -->
        <a href="https://www.pinterest.com" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Pinterest">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12.017 0C5.396 0..."/></svg>
        </a>
      </div>

      <div class="footer-text">
        <small>Built with TheMealDB • Favorites stored locally • Mobile-first</small>
      </div>

      <div class="footer-datetime" id="footerDateTime"></div>
    </div>
  </footer>

  <script src="database.js"></script>
  <script src="script.js"></script>
</body>
</html>
